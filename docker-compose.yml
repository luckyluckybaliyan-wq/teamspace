services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/teamspace
      JWT_SECRET: change-this-secret
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

volumes:
  mongo-data:
